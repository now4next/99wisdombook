name = "99wisdombook-pages"
compatibility_date = "2026-02-15"
pages_build_output_dir = "dist"   # ⚠ 루트(./)로 두면 개발 파일이 공개된다. CLAUDE.md 참고

[[d1_databases]]
binding = "DB"
database_name = "wisdom-book-db"
database_id = "996bdff0-0260-446b-bf14-49063c6d7ca3"

# ── 이메일 알림 (Resend) ────────────────────────────────────
# MAIL_FROM 의 도메인이 Resend 에서 검증돼야 이 주소로 실제 발송된다.
# 검증 전에는 MAIL_FROM_FALLBACK → onboarding@resend.dev 순으로 내려간다.
# 관리자 화면의 "이메일 발송 테스트" 응답에 실제 사용된 발신자가 찍힌다.
[vars]
MAIL_FROM = "99 Wisdom Insight <daily@99wisdombook.org>"
MAIL_REPLY_TO = "info@99wisdombook.org"
# MAIL_FROM_FALLBACK = "99 Wisdom Insight <onboarding@resend.dev>"

# secrets (wrangler pages secret put ... --project-name 99wisdombook):
#   RESEND_API_KEY   resend.com > API Keys
#   CRON_SECRET      랜덤 문자열 — /api/notify/* 크론 보호. 없으면 알림이 전혀 발송되지 않는다.
#   VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY   Web Push 용
