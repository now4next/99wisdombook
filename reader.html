<script>
(function () {
  'use strict';


  /* 핵심 메시지별 상징 문양 — 원형 16종을 장에 배정하고 부 색상과 결합한다 */
  var MARKS = {
    'balance': '<path d="M50 18v62"/><path d="M22 32h56"/><path d="M34 84h32"/><path d="M10 32a12 12 0 0024 0"/><path d="M66 32a12 12 0 0024 0"/>',
    'split': '<path d="M50 18v16"/><path d="M50 34c-15 0-22 9-22 18M50 34c15 0 22 9 22 18M50 34v18"/><circle cx="28" cy="64" r="10"/><circle cx="50" cy="64" r="10"/><circle cx="72" cy="64" r="10"/>',
    'wave': '<path d="M12 50c9-26 18-26 27 0s18 26 27 0 16-24 22-10"/><path d="M12 76h76" stroke-dasharray="3 5"/>',
    'flow': '<path d="M24 58a26 26 0 0 1 44-19"/><path d="M59 33l11 4-4 11"/><path d="M76 44a26 26 0 0 1-44 19"/><path d="M41 69l-11-4 4-11"/>',
    'chain': '<path d="M20 50a12 12 0 0112-12h6a12 12 0 010 24h-6a12 12 0 01-12-12z"/><path d="M56 50a12 12 0 0112-12h6a12 12 0 010 24h-6a12 12 0 01-12-12z"/><path d="M46 50h12"/>',
    'growth': '<path d="M50 86V42"/><path d="M50 62c-11 0-18-7-18-16 9 0 18 7 18 16z"/><path d="M50 52c11 0 18-7 18-16-9 0-18 7-18 16z"/><path d="M34 86h32"/>',
    'ring': '<circle cx="50" cy="50" r="29"/><circle cx="50" cy="50" r="20" stroke-dasharray="2 7"/>',
    'arch': '<path d="M16 76V54a10 10 0 0120 0v22"/><path d="M40 76V54a10 10 0 0120 0v22"/><path d="M64 76V54a10 10 0 0120 0v22"/><path d="M12 76h76M12 44h76"/>',
    'mask': '<path d="M32 36c0-9 8-16 18-16s18 7 18 16v14c0 15-8 26-18 26s-18-11-18-26z"/><path d="M32 52h36" stroke-dasharray="3 4"/><path d="M41 42h4M55 42h4"/>',
    'two-groups': '<circle cx="34" cy="40" r="11"/><circle cx="66" cy="40" r="11"/><path d="M18 78c0-11 7-19 16-19s16 8 16 19"/><path d="M50 78c0-11 7-19 16-19s16 8 16 19"/>',
    'path': '<path d="M50 86V58"/><path d="M50 58L28 30M50 58l22-28"/><circle cx="28" cy="26" r="4"/><circle cx="72" cy="26" r="4"/>',
    'lens': '<circle cx="44" cy="44" r="21"/><path d="M59 59l21 21"/><path d="M34 44h20" stroke-dasharray="3 3"/>',
    'peak': '<path d="M12 72c15 0 16-42 31-42s17 42 45 42"/><path d="M12 84h76" stroke-dasharray="3 5"/>',
    'bow': '<path d="M50 86V42c0-11 9-20 22-20"/><path d="M64 24c0 7-5 11-11 13M72 31c-2 7-9 9-15 9M76 40c-5 4-11 5-17 4"/>',
    'branch': '<path d="M14 50h20"/><path d="M34 50c11 0 13-21 24-21h28M34 50c11 0 13 21 24 21h28"/><circle cx="88" cy="29" r="3"/><circle cx="88" cy="71" r="3"/>',
    'thread': '<circle cx="28" cy="50" r="7"/><circle cx="50" cy="50" r="7"/><circle cx="72" cy="50" r="7"/><path d="M12 50h9M35 50h8M57 50h8M79 50h9"/>'
  };
  var MARK_OF = { 1:'balance', 2:'wave', 3:'split', 4:'branch', 12:'chain', 13:'growth', 14:'flow', 23:'ring', 24:'arch', 25:'wave', 34:'mask', 35:'two-groups', 36:'balance', 45:'two-groups', 46:'lens', 47:'mask', 56:'path', 57:'growth', 58:'thread', 67:'path', 68:'branch', 69:'arch', 78:'lens', 79:'peak', 80:'bow', 89:'branch', 90:'peak', 91:'lens', 5:'balance', 15:'wave', 26:'ring', 37:'lens', 48:'branch', 59:'growth', 70:'flow', 81:'path', 92:'split', 6:'mask', 16:'wave', 27:'flow', 38:'lens', 49:'chain', 60:'arch', 71:'peak', 82:'path', 93:'bow', 7:'balance', 17:'flow', 28:'wave', 39:'split', 50:'two-groups', 61:'thread', 72:'chain', 83:'peak', 94:'growth', 8:'ring', 18:'flow', 29:'wave', 40:'mask', 51:'lens', 62:'path', 73:'chain', 84:'branch', 95:'growth', 9:'balance', 19:'ring', 30:'arch', 41:'thread', 52:'mask', 63:'peak', 74:'two-groups', 85:'split', 96:'bow', 10:'mask', 20:'ring', 31:'flow', 42:'wave', 53:'thread', 64:'arch', 75:'growth', 86:'lens', 97:'balance', 11:'ring', 21:'flow', 32:'path', 43:'mask', 54:'bow', 65:'chain', 76:'wave', 87:'arch', 98:'split', 22:'thread', 33:'ring', 44:'split', 55:'two-groups', 66:'peak', 77:'mask', 88:'balance', 99:'lens' };
  function markSvg(chapterId, cls) {
    var k = MARK_OF[chapterId] || 'ring';
    return '<svg class="' + cls + '" viewBox="0 0 100 100" aria-hidden="true">' + MARKS[k] + '</svg>';
  }

  var LENS_KO = {
    origin:'원형', science:'과학', history:'역사', person:'인물', business:'비즈니스',
    daily:'일상', counter:'반론', eastwest:'동서', practice:'실천', reflection:'성찰'
  };
  var LENS_EN = {
    origin:'Origin', science:'Science', history:'History', person:'Person', business:'Business',
    daily:'Daily', counter:'Counter', eastwest:'East & West', practice:'Practice', reflection:'Reflection'
  };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* 최소 Markdown → HTML (## 제목, > 인용, - 목록, **굵게**, *기울임*) */
  function md(src) {
    if (!src) return '';
    var blocks = String(src).split(/\n{2,}/), out = [];
    blocks.forEach(function (b) {
      b = b.trim();
      if (!b) return;
      var inline = function (t) {
        return esc(t)
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/(^|[^*])\*([^*\n]+?)\*/g, '$1<em>$2</em>')
          .replace(/\n/g, '<br>');
      };
      if (/^##\s+/.test(b))       out.push('<h3>' + inline(b.replace(/^##\s+/, '')) + '</h3>');
      else if (/^>\s?/.test(b))   out.push('<blockquote style="border-left:3px solid var(--accent);padding-left:16px;color:var(--muted);font-family:var(--serif)">' + inline(b.replace(/^>\s?/gm, '')) + '</blockquote>');
      else if (/^-\s+/.test(b))   out.push('<ul style="padding-left:20px">' + b.split('\n').map(function (l) {
                                     return '<li>' + inline(l.replace(/^-\s+/, '')) + '</li>';
                                   }).join('') + '</ul>');
      else                        out.push('<p>' + inline(b) + '</p>');
    });
    return out.join('\n');
  }

  function getSlug() {
    var q = new URLSearchParams(location.search).get('s');
    if (q) return q;
    var m = location.pathname.match(/\/insight\/([^/?#]+)/);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function notFound(msg) {
    document.getElementById('root').innerHTML =
      '<div style="padding:80px 0;text-align:center">' +
        '<span class="icon-chip lg t-p9" style="margin:0 auto 20px">' +
          '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>' +
        '</span>' +
        '<h1 style="font-family:var(--serif);font-weight:700;font-size:1.5rem;letter-spacing:-.025em">' + esc(msg) + '</h1>' +
        '<p style="color:var(--muted);margin-top:12px;font-size:.93rem">아직 발행되지 않았거나 주소가 바뀌었을 수 있어요.</p>' +
        '<div style="display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin-top:26px">' +
          '<a class="btn-line" href="/parts.html">99장 목록</a>' +
          '<a class="btn-accent" href="/">칼럼 홈</a>' +
        '</div>' +
      '</div>';
  }

  var slug = getSlug();
  if (!slug) { notFound('칼럼을 찾을 수 없습니다'); return; }

  fetch('/api/insights/' + encodeURIComponent(slug))
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function (d) {
      var it = d && d.insight;
      if (!it) return notFound('칼럼을 찾을 수 없습니다');

      var partNo = it.part_id || 1;
      document.body.className = 't-p' + partNo;
      document.title = it.title + ' · 99 Wisdom Insight';

      var lensKo = LENS_KO[it.lens] || it.lens;
      var lensEn = LENS_EN[it.lens] || '';
      var pubDate = it.published_at ? new Date(it.published_at) : null;
      var dateStr = pubDate && !isNaN(pubDate)
        ? pubDate.getFullYear() + '. ' + String(pubDate.getMonth() + 1).padStart(2, '0') + '. ' + String(pubDate.getDate()).padStart(2, '0')
        : '';

      var html = '';

      /* 머리 — 앵커 문장이 주인공, 제목은 그 아래 각도 */
      html += '<header class="art-head anchor-only">' +
        '<span class="kicker">제' + partNo + '부 ' + it.chapter_id + '장 · ' + esc(lensKo) + '</span>' +
        (it.anchor_quote
          ? '<div class="anchor-hero">' +
              '<p class="anchor-hero-q">' + esc(it.anchor_quote) + '</p>' +
            '</div>'
          : '') +
        '<div class="art-mark">' + markSvg(it.chapter_id, 'mark-lead') + '</div>' +
      '</header>';

      /* 본문 — 제목·메타·리드를 본문 시작부로 내린다 */
      html += '<div class="art-body">' +
        '<div class="art-open">' +
          '<h1 class="art-title">' + esc(it.title) + '</h1>' +
          '<div class="art-open-meta">' +
            (it.reading_time ? '<span>읽는 시간 ' + it.reading_time + '분</span>' : '') +
            (dateStr ? '<span>' + dateStr + '</span>' : '') +
            '<span>' + esc(lensKo) + '</span>' +
          '</div>' +
        '</div>' +
        (it.hook ? '<p class="art-lead">' + esc(it.hook) + '</p>' : '') +
        md(it.body_md) +
      '</div>';

      /* 실천 */
      if (it.action) {
        var lines = String(it.action).split('\n').filter(function (l) { return l.trim(); });
        html += '<div class="action"><span class="k">Action · 오늘의 실천</span><ul>' +
          lines.map(function (l) { return '<li>' + esc(l.replace(/^[-•]\s*/, '')) + '</li>'; }).join('') +
        '</ul></div>';
      }

      /* Quotable */
      if (it.quotable) {
        html += '<div class="mark-close">' + markSvg(it.chapter_id, 'mark-end') + '</div>';
        html += '<div class="quotable">' +
          '<div class="k">Quotable · 오늘의 한 줄</div>' +
          '<div class="q">“' + esc(it.quotable) + '”</div>' +
        '</div>';
      }

      /* 출처 */
      if ((it.sources || []).length === 1) {
        var s0 = it.sources[0];
        var stxt = (typeof s0 === 'string') ? s0 : (s0.title || '');
        html += '<p class="source-one">' +
          '<span class="k">출처</span>' + esc(stxt) +
          (s0 && s0.url ? ' <a href="' + esc(s0.url) + '" target="_blank" rel="noopener noreferrer">링크</a>' : '') +
        '</p>';
      } else if ((it.sources || []).length) {
        html += '<section class="sources" style="margin-bottom:44px"><h4>Sources · 출처</h4><ol>' +
          it.sources.map(function (s) {
            if (typeof s === 'string') return '<li>' + esc(s) + '</li>';
            return '<li>' +
              (s.type ? '<span class="t">' + esc(s.type) + '</span><br>' : '') +
              esc(s.title || '') +
              (s.url ? ' <a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">링크</a>' : '') +
              (s.accessed_at ? ' <span style="color:var(--muted-2)">(접근 ' + esc(s.accessed_at) + ')</span>' : '') +
            '</li>';
          }).join('') +
        '</ol></section>';
      }

      /* 공유 카드 — quotable 로 구운 PNG (링크 미리보기/인스타)
         ⚠ 카드 PNG 는 슬러그당 경로가 고정이고 Cache-Control 이 4시간이다.
            앵커 문구를 고쳐 카드를 다시 구우면 URL 이 그대로라 브라우저가
            옛 카드를 계속 쓴다. 그래서 updated_at 을 ?v= 로 붙여 둔다.
            칼럼을 고칠 때 updated_at 을 반드시 함께 갱신할 것. */
      if (it.hero_image) {
        var cardVer = String(it.updated_at || it.published_at || '').replace(/\D/g, '').slice(0, 14) || '1';
        var card2x1 = it.hero_image + (it.hero_image.indexOf('?') >= 0 ? '&' : '?') + 'v=' + cardVer;
        var card1x1 = it.hero_image.replace(/\.png$/, '-1x1.png') + '?v=' + cardVer;
        html += '<section style="margin-bottom:44px">' +
          '<div class="slabel"><h2>Share</h2><span class="sub">카드 이미지</span><span class="rule"></span></div>' +
          '<div class="share-cards">' +
            '<figure><img src="' + esc(card2x1) + '" alt="공유 카드 2:1" loading="lazy">' +
              '<figcaption>2:1 · 링크 미리보기</figcaption></figure>' +
            '<figure><img src="' + esc(card1x1) + '" alt="공유 카드 1:1" loading="lazy">' +
              '<figcaption>1:1 · 인스타그램 피드</figcaption></figure>' +
          '</div>' +
          '<div class="share-btns">' +
            '<a class="sbtn" id="sh-save" href="' + esc(card2x1) + '" download><i class="ic"></i>이미지 저장</a>' +
            '<button class="sbtn" id="sh-copy"><i class="ic"></i>링크 복사</button>' +
          '</div>' +
          '<div id="sh-msg" class="share-msg"></div>' +
        '</section>';
      }

      /* 원문 · 같은 장 */
      html += '<section style="margin-bottom:56px;border-top:1px solid var(--line);padding-top:28px;' +
                'display:flex;flex-wrap:wrap;gap:16px;align-items:center">' +
        '<div><span class="col-kicker">이 칼럼의 앵커</span>' +
          '<div style="font-family:var(--serif);font-weight:700;font-size:1.1rem;margin-top:6px;letter-spacing:-.02em">제' + it.chapter_id + '장</div></div>' +
        '<div style="margin-left:auto;display:flex;gap:10px;flex-wrap:wrap">' +
          '<a class="btn-line" href="/parts.html#part-' + partNo + '">제' + partNo + '부 목록</a>' +
          '<a class="btn-line" href="/chapter/' + it.chapter_id + '">원문 보기</a>' +
        '</div>' +
      '</section>';

      document.getElementById('root').innerHTML = html;

      /* OG/설명 갱신 */
      var dsc = document.querySelector('meta[name="description"]');
      if (dsc) dsc.setAttribute('content', it.hook || it.quotable || it.title);

      /* 공유 동작 */
      var pageUrl = location.origin + '/insight/' + encodeURIComponent(it.slug);
      function msg(t) {
        var el = document.getElementById('sh-msg');
        if (!el) return;
        el.textContent = t; el.classList.add('on');
        setTimeout(function () { el.classList.remove('on'); }, 2200);
      }
      var bc = document.getElementById('sh-copy');
      if (bc) bc.addEventListener('click', function () {
        (navigator.clipboard ? navigator.clipboard.writeText(pageUrl) : Promise.reject())
          .then(function () { msg('링크를 복사했습니다'); })
          .catch(function () { msg(pageUrl); });
      });
    })
    .catch(function () { notFound('칼럼을 찾을 수 없습니다'); });

  /* 로그인한 독자가 칼럼을 열면 연속 독서를 기록한다.
     알림이 daily.html 이 아니라 이 페이지로 오게 됐으므로, 여기서도 스트릭을 올려야
     읽고 있는데 스트릭이 끊기는 일이 생기지 않는다. 화면에는 아무것도 바꾸지 않는다. */
  (function markStreak() {
    var token = '';
    try {
      token = localStorage.getItem('authToken') || sessionStorage.getItem('authToken') || '';
    } catch (_) { return; }
    if (!token) return;
    var d = new Date();
    var date = d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
    fetch('/api/wisdom/streak', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ date: date })
    }).catch(function () {});
  })();
})();
</script>

</body>
</html>
