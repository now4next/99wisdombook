  .note-body { font-size: .96rem; line-height: 1.8; white-space: pre-wrap; }
  .note-src { margin-top: 9px; font-size: .8rem; }
  .note-src a { color: var(--muted-2); text-decoration: none; }
  .note-src a:hover { color: var(--accent, #5FA97E); text-decoration: underline; }
</style>

<section class="section">

    <h2>Notes</h2>
    <span class="sub" id="stat-line">독자의 기록</span>
    <span class="rule"></span>
  </div>

  <p class="lead" style="margin-bottom:30px">
    칼럼과 원문을 읽은 분들이 남긴 소감입니다. 이름은 각자 정한
    <strong style="color:var(--ink)">별명</strong>으로만 보입니다.
    메일로 받은 링크로 들어오시면 어느 글에서든 기록을 남기실 수 있습니다.
  </p>

<script src="/api-client.js"></script>
<script src="/subscribe-cta.js"></script>
<script>
(function () {
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function fmt(d) {
    var m = String(d || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? m[1] + '. ' + m[2] + '. ' + m[3] : '';
  }

  var root = document.getElementById('notes-root');

  fetch('/api/notes/recent?limit=60')
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.success) throw new Error('fail');
      var list = d.notes || [];

      document.getElementById('stat-line').textContent =
        d.count ? '기록 ' + d.count + '개 · ' + d.writers + '명' : '독자의 기록';

      /* 아직 아무도 쓰지 않았을 때. 빈 목록만 두면 죽은 화면으로 보인다. */
      if (!list.length) {
        root.innerHTML = '<p style="color:var(--muted-2);font-size:.95rem;line-height:1.8">'
          + '아직 남은 기록이 없습니다.<br>'
          + '메일로 받은 링크로 칼럼이나 원문에 들어가시면 첫 기록을 남기실 수 있습니다.</p>';
        return;
      }

      root.innerHTML = list.map(function (x) {
        /* 원문만 있고 칼럼이 없는 장도 있다. 그때는 원문으로 보낸다. */
        var href = x.slug ? '/insight/' + encodeURIComponent(x.slug) : '/chapter/' + x.chapter_id;
        var label = x.title || ('제' + x.chapter_id + '장 원문');
        return '<article class="note-card">'
          + '<div class="note-head"><span class="note-nick">' + esc(x.nick || '독자') + '</span>'
          + '<span>·</span><span>' + fmt(x.created_at) + '</span></div>'
          + '<div class="note-body">' + esc(x.body) + '</div>'
          + '<div class="note-src"><a href="' + esc(href) + '">'
          + esc(label) + ' &rarr;</a></div>'
          + '</article>';
      }).join('');
    })
    .catch(function () {
      root.innerHTML = '<p style="color:var(--muted-2);font-size:.9rem">불러오지 못했습니다.</p>';
    });

  mountSubscribeCta(document.getElementById('sub-cta'), {
    lead: '여기 남은 기록들은 모두 메일로 글을 받아 보는 분들이 쓴 것입니다.<br>'
      + '<b>회원가입도 비밀번호도 없습니다</b> — 주소만 적으시면 링크가 갑니다.',
  });
})();
</script>
